<!DOCTYPE html><html><head><meta charset="utf-8"><title>peer test</title></head><body>
<pre id="log"></pre>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>
const log = (s) => { document.getElementById('log').textContent += s + '\n'; console.log('PEERTEST ' + s); };
const q = new URLSearchParams(location.search); const code = q.get('code');
if (typeof Peer === 'undefined') log('no Peer library');
else if (q.get('role') === 'host') {
  const p = new Peer('crownhold-' + code);
  p.on('open', id => log('host open ' + id));
  p.on('connection', c => { log('host: incoming'); c.on('data', d => { log('host got ' + JSON.stringify(d)); c.send({ pong: 1 }); setTimeout(() => { log('host done'); p.destroy(); }, 1500); }); c.on('open', () => log('host conn open')); });
  setTimeout(() => { log('host timeout'); p.destroy(); }, 120000);
  p.on('error', e => log('host error ' + e.type + ' ' + e.message));
} else {
  const p = new Peer();
  p.on('open', id => { log('client open ' + id); const c = p.connect('crownhold-' + code, { reliable: true, serialization: 'json' }); c.on('open', () => { log('client conn open'); c.send({ ping: 1 }); }); c.on('data', d => { log('client got ' + JSON.stringify(d)); setTimeout(() => { log('client done'); p.destroy(); }, 500); }); c.on('error', e => log('conn error ' + e)); });
  p.on('error', e => log('client error ' + e.type + ' ' + e.message));
  setTimeout(() => { log('client timeout'); p.destroy(); }, 120000);
}
</script></body></html>
